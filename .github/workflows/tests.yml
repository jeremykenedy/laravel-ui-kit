name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.5'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
          - php: '8.5'
            laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
          composer update --prefer-dist --no-interaction

      - name: Tests
        run: ./vendor/bin/pest --ci

  lowest:
    runs-on: ubuntu-latest
    name: Lowest dependencies

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install lowest supported dependencies
        run: composer update --prefer-dist --prefer-lowest --prefer-stable --no-interaction

      - name: Tests
        run: ./vendor/bin/pest --ci

  lint:
    runs-on: ubuntu-latest
    name: Pint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Pint
        run: ./vendor/bin/pint --test

  composer-validate:
    runs-on: ubuntu-latest
    name: Composer metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Check for known vulnerabilities
        run: composer audit --no-interaction

  frontend-components:
    runs-on: ubuntu-latest
    name: Frontend components

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify each frontend ships the same component set
        run: |
          vue=$(ls resources/js/vue/Ui*.vue | xargs -n1 basename | sed 's/\.vue$//' | sort)
          react=$(ls resources/js/react/Ui*.jsx | xargs -n1 basename | sed 's/\.jsx$//' | sort)
          svelte=$(ls resources/js/svelte/Ui*.svelte | xargs -n1 basename | sed 's/\.svelte$//' | sort)
          diff <(echo "$vue") <(echo "$react") || (echo "Vue and React component sets differ" && exit 1)
          diff <(echo "$vue") <(echo "$svelte") || (echo "Vue and Svelte component sets differ" && exit 1)
          echo "$vue" | wc -l

      - name: Verify each CSS framework ships the same template set
        run: |
          tailwind=$(ls resources/views/tailwind/components/*.blade.php | xargs -n1 basename | sort)
          bootstrap5=$(ls resources/views/bootstrap5/components/*.blade.php | xargs -n1 basename | sort)
          bootstrap4=$(ls resources/views/bootstrap4/components/*.blade.php | xargs -n1 basename | sort)
          diff <(echo "$tailwind") <(echo "$bootstrap5") || (echo "Tailwind and Bootstrap 5 template sets differ" && exit 1)
          diff <(echo "$tailwind") <(echo "$bootstrap4") || (echo "Tailwind and Bootstrap 4 template sets differ" && exit 1)

      - name: Verify Livewire views exist
        run: test -d resources/views/livewire

      - name: Verify every locale ships the ui-kit file
        run: |
          for dir in resources/lang/*/; do
            test -f "${dir}ui-kit.php" || (echo "Missing translations in ${dir}" && exit 1)
          done
