        <rect x="14" y="44" width="96" height="8" rx="4" fill="#cbd5e1"/>
        <rect x="14" y="63" width="156" height="22" rx="5" stroke="#e5e7eb"/>
        <rect x="22" y="72" width="76" height="4" rx="2" fill="#cbd5e1"/>
