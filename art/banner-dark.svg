<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none" role="img" aria-labelledby="title description">
    <title id="title">Laravel UI Kit</title>
    <desc id="description">Reusable Laravel components with Tailwind and Bootstrap options.</desc>
    <defs>
        <linearGradient id="background" x2="1" y2="1">
            <stop stop-color="#0c0a09"/>
            <stop offset="1" stop-color="#1c1917"/>
        </linearGradient>
    </defs>
    <rect width="800" height="200" rx="16" fill="url(#background)"/>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
        <text x="48" y="80" fill="#fff" font-size="40" font-weight="700" letter-spacing="-.5">Laravel UI Kit</text>
        <text x="48" y="111" fill="#a8a29e" font-size="14">Familiar components. Your choice of framework.</text>
        <rect x="48" y="132" width="102" height="22" rx="11" fill="#1a1a1a" stroke="#a78bfa" stroke-width=".8" opacity=".8"/>
        <text x="99" y="147" fill="#a78bfa" font-size="10" font-weight="500" text-anchor="middle">25 components</text>
        <rect x="158" y="132" width="72" height="22" rx="11" fill="#1a1a1a" stroke="#60a5fa" stroke-width=".8" opacity=".8"/>
        <text x="194" y="147" fill="#60a5fa" font-size="10" font-weight="500" text-anchor="middle">Tailwind</text>
        <rect x="238" y="132" width="106" height="22" rx="11" fill="#1a1a1a" stroke="#4ade80" stroke-width=".8" opacity=".8"/>
        <text x="291" y="147" fill="#4ade80" font-size="10" font-weight="500" text-anchor="middle">Bootstrap 4 / 5</text>
        <rect x="352" y="132" width="88" height="22" rx="11" fill="#1a1a1a" stroke="#fbbf24" stroke-width=".8" opacity=".8"/>
        <text x="396" y="147" fill="#fbbf24" font-size="10" font-weight="500" text-anchor="middle">Dark mode</text>
    </g>
    <g transform="translate(568 36)">
        <rect width="184" height="128" rx="12" fill="#292524" stroke="#44403c"/>
        <circle cx="16" cy="16" r="3" fill="#a78bfa"/>
        <circle cx="27" cy="16" r="3" fill="#60a5fa"/>
        <circle cx="38" cy="16" r="3" fill="#4ade80"/>
        <path d="M0 30H184" stroke="#44403c"/>
        <rect x="14" y="44" width="96" height="8" rx="4" fill="#57534e"/>
        <rect x="14" y="63" width="156" height="22" rx="5" stroke="#44403c"/>
        <rect x="22" y="72" width="76" height="4" rx="2" fill="#57534e"/>
        <rect x="14" y="98" width="68" height="17" rx="5" fill="#6366f1"/>
        <rect x="26" y="105" width="44" height="3" rx="1.5" fill="#fff"/>
        <rect x="138" y="98" width="32" height="17" rx="8.5" fill="#22c55e"/>
        <circle cx="161" cy="106.5" r="5.5" fill="#fff"/>
    </g>
</svg>
