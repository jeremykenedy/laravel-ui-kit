<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none" role="img" aria-labelledby="title description">
    <title id="title">Laravel UI Kit</title>
    <desc id="description">Reusable Laravel components with Tailwind and Bootstrap options.</desc>
    <rect width="800" height="200" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
        <text x="48" y="80" fill="#0f172a" font-size="40" font-weight="700" letter-spacing="-.5">Laravel UI Kit</text>
        <text x="48" y="111" fill="#64748b" font-size="14">Familiar components. Your choice of framework.</text>
        <rect x="48" y="132" width="102" height="22" rx="11" fill="#f5f3ff" stroke="#8b5cf6" stroke-width=".8"/>
        <text x="99" y="147" fill="#6d28d9" font-size="10" font-weight="500" text-anchor="middle">25 components</text>
        <rect x="158" y="132" width="72" height="22" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width=".8"/>
        <text x="194" y="147" fill="#1e40af" font-size="10" font-weight="500" text-anchor="middle">Tailwind</text>
        <rect x="238" y="132" width="106" height="22" rx="11" fill="#f0fdf4" stroke="#22c55e" stroke-width=".8"/>
        <text x="291" y="147" fill="#166534" font-size="10" font-weight="500" text-anchor="middle">Bootstrap 4 / 5</text>
        <rect x="352" y="132" width="88" height="22" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width=".8"/>
        <text x="396" y="147" fill="#b45309" font-size="10" font-weight="500" text-anchor="middle">Dark mode</text>
